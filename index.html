<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F2A2E">
  <meta name="description" content="یک زنگ، یک حساب ساده، یک سؤال. تجربه‌ی کوتاه دو دقیقه‌ای.">
  <meta name="referrer" content="no-referrer">
  <meta property="og:title" content="چند صبح دیگه؟">
  <meta property="og:description" content="یه حساب ساده که شاید تا حالا نکرده باشی.">
  <meta property="og:image" content="media/cover.jpg">
  <title>چند صبح دیگه؟</title>
  <link rel="preload" href="fonts/Vazirmatn-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Vazirmatn-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <main class="app" id="app">
    <div class="screen is-intro" id="screen">
      <video id="vA" class="film" playsinline preload="none" poster="media/cover.jpg"></video>
      <video id="vB" class="film hidden" playsinline preload="none"></video>
      <div class="shade" id="shade"></div>
      <div class="bar" aria-hidden="true"><i id="progress"></i></div>
      <button class="icon mute hidden" id="mute" type="button" aria-label="صدا">🔊</button>
      <button class="mini-cta hidden" id="mini" type="button">بقیه‌ی ماجرا ←</button>
      <div class="tap-hint hidden" id="paused">▶ ادامه</div>
      <div class="loading hidden" id="loading"><span></span>در حال بارگذاری…</div>
      <section class="stage" id="stage" aria-live="polite"></section>
    </div>
    <audio id="voice" preload="none"></audio>
    <noscript><div class="noscript">برای اجرای این تجربه، جاوااسکریپت مرورگر را فعال کن.</div></noscript>
  </main>
</body>
</html>
